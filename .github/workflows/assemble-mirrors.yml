name: assemble-mirrors
on:
  push:
    paths:
      - media/_chunks/ASSEMBLE_MIRRORS
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: concat mirrors
        run: |
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          base = Path("media/_chunks/media__public__photos__mirrors.jpg.b64")
          order = [f"c{i:04d}" for i in range(0, 26)]
          data = b"".join((base / name).read_bytes() for name in order)
          if len(data) != 204400:
              raise SystemExit(f"size {len(data)}")
          blob = hashlib.sha1(b"blob 204400\0" + data).hexdigest()
          if blob != "c42f637f4ff09fde3da2cd8fc5a990f3c5939dfc":
              raise SystemExit(f"sha {blob}")
          dest = Path("media/public/photos/mirrors.jpg.b64")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_bytes(data)
          PY
          git config user.name "assemble"
          git config user.email "assemble@users.noreply.github.com"
          git add media/public/photos/mirrors.jpg.b64
          git commit -m "Assemble exact mirrors payload"
          git push
