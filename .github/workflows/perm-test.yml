name: perm-test
on:
  push:
    paths:
      - media/_probe/RUNTEST
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: write marker
        run: |
          echo ok > media/_probe/action-ok.txt
          git config user.name "assemble"
          git config user.email "assemble@users.noreply.github.com"
          git add media/_probe/action-ok.txt
          git commit -m "Action write test"
          git push
